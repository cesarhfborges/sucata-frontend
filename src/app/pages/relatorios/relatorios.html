<div class="grid grid-flow-col grid-rows-1 grid-cols-3 gap-4 height-full">

    <div class="row-span-1 col-span-1">
        <p-card>
            <form [formGroup]="form" class="flex flex-col gap-4">
            <span class="text-lg font-semibold">
                Filtros do Relatório
            </span>

                <!-- Cliente -->
                <div class="flex flex-col gap-1">
                    <label class="text-sm">Cliente</label>
                    <p-inputNumber
                        formControlName="cliente_id"
                        placeholder="ID do cliente"
                        [useGrouping]="false">
                    </p-inputNumber>
                </div>

                <!-- Empresas -->
                <div class="flex flex-col gap-1">
                    <label class="text-sm">Empresas</label>
                    <p-multi-select
                        formControlName="empresas"
                        [options]="[1,2,3,4,5,6]"
                    ></p-multi-select>
                </div>

                <!-- Status -->
                <div class="flex flex-col gap-1">
                    <label class="text-sm">Status</label>
                    <p-select
                        formControlName="status"
                        [options]="[
                        { label: 'Todas', value: 'TODAS' },
                        { label: 'Pendentes', value: 'PENDENTE' },
                        { label: 'Devolvidas', value: 'DEVOLVIDAS' }
                    ]">
                    </p-select>
                </div>

                <!-- Datas -->
                <div formGroupName="datas" class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-sm">Data início</label>
                        <p-date-picker
                            formControlName="inicio"
                            dateFormat="yy-mm-dd"
                            showIcon>
                        </p-date-picker>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-sm">Data fim</label>
                        <p-date-picker
                            formControlName="fim"
                            dateFormat="yy-mm-dd"
                            showIcon>
                        </p-date-picker>
                    </div>
                </div>

                <!-- Ações -->
                <div class="flex flex-row justify-between gap-2 col-span-12 mt-4">
                    <p-button
                        label="Limpar"
                        severity="secondary"
                        icon="pi pi-times"
                        (onClick)="limpar()">
                    </p-button>
                    <p-button
                        label="Gerar"
                        icon="pi pi-file-pdf"
                        [loading]="loading"
                        (onClick)="gerarRelatorio()">
                    </p-button>
                </div>
            </form>
        </p-card>

        <pre>
            <code>
                {{form.value|json}}
            </code>
        </pre>
    </div>
    <div class="row-span-1 col-span-2">
        <div class="row-span-1 col-span-2 h-full bg-surface-900 rounded-lg shadow-sm flex flex-col">

            @if (pdfUrl) {
                <div class="flex-1">
                    <ng2-pdfjs-viewer
                        viewerId="relatorioViewer"
                        [pdfSrc]="pdfUrl"
                        [showDownload]="true"
                        [showPrint]="true"
                        [showOpenFile]="false"
                        [showFullScreen]="false"
                        [showFind]="true"
                        [showSpinner]="true"
                        [showAnnotations]="false"
                        [showSidebar]="false"
                        [showViewBookmark]="false"
                        [downloadOnLoad]="false"
                        downloadFileName="relatorio-sucatas"
                        zoom="page-width"
                        style="width: 100%; height: 100%;"
                    />
                </div>
            } @else {
                <div class="flex-1 flex flex-col items-center justify-center text-gray-400">
                    <i class="pi pi-file-pdf text-4xl mb-3"></i>
                    <span class="text-sm">Nenhum relatório para exibir</span>
                    <span class="text-xs">Preencha os filtros e gere o relatório</span>
                </div>
            }

        </div>
    </div>
</div>
