<div class="max-w-7xl mx-auto" [ngxLoaderIndicator]="loading">
    <p-card>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">

                <h3 class="col-span-12">Cadastro de materiais</h3>

                <div class="flex flex-col gap-2 col-span-12">
                    <label for="codigo" class="font-semibold">Código</label>
                    <input
                        pInputText
                        id="codigo"
                        formControlName="codigo"
                    />
                    <app-validator-message [control]="form.get('codigo')" />
                </div>

                <div class="flex flex-col gap-2 col-span-12">
                    <label for="descricao" class="font-semibold ">Descrição</label>
                    <input pInputText id="descricao" formControlName="descricao" />
                    <app-validator-message [control]="form.get('descricao')" />
                </div>

                <div class="flex flex-col gap-2 col-span-12">
                    <label for="un" class="font-semibold ">Un. medida</label>
                    <input pInputText id="un" formControlName="un" />
                    <app-validator-message [control]="form.get('un')" />
                </div>

                <div class="flex flex-row justify-between gap-2 col-span-12 mt-4">
                    <button
                        pButton
                        type="button"
                        severity="secondary"
                        [routerLink]="['/materiais']"
                    >
                        <i class="pi pi-times" pButtonIcon></i>
                        <span pButtonLabel>Cancelar</span>
                    </button>
                    <button
                        pButton
                        type="submit"
                        severity="success"
                    >
                        <i class="pi pi-check" pButtonIcon></i>
                        <span pButtonLabel>Salvar</span>
                    </button>
                </div>
            </div>
        </form>
    </p-card>
</div>
