<div class="max-w-7xl mx-auto" [ngxLoaderIndicator]="loading">
    <p-card>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">

                <h3 class="col-span-12">Cadastro de materiais</h3>

                <div class="flex flex-col gap-2 col-span-12">
                    <label for="codigo" class="font-semibold">Código</label>
                    <input
                        pInputText
                        id="codigo"
                        formControlName="codigo"
                    />
                    <app-validator-message [control]="form.get('codigo')" />
                </div>

                <div class="flex flex-col gap-2 col-span-12">
                    <label for="descricao" class="font-semibold ">Descrição</label>
                    <input pInputText id="descricao" formControlName="descricao" />
                    <app-validator-message [control]="form.get('descricao')" />
                </div>

                <div class="flex flex-col gap-2 col-span-12">
                    <label for="un" class="font-semibold ">Un. medida</label>
                    <input pInputText id="un" formControlName="un" />
                    <app-validator-message [control]="form.get('un')" />
                </div>

                <div class="flex flex-row justify-between gap-2 col-span-12 mt-4">
                    <button
                        pButton
                        type="button"
                        severity="secondary"
                        [routerLink]="['/materiais']"
                    >
                        <i class="pi pi-times" pButtonIcon></i>
                        <span pButtonLabel>Cancelar</span>
                    </button>
                    <button
                        pButton
                        type="submit"
                        severity="success"
                    >
                        <i class="pi pi-check" pButtonIcon></i>
                        <span pButtonLabel>Salvar</span>
                    </button>
                </div>
            </div>
        </form>
    </p-card>
    @if (material) {
        <div class="grid grid-cols-1 md:grid-cols-6">
            <div class="col-span-6 col-start-0 lg:col-start-2 lg:col-span-4 mt-6 rounded-[4px] border border-gray-300 dark:border-gray-700 p-4">
                <div class="grid grid-cols-1 md:grid-cols-2 text-sm w-full">
                    <!-- Cadastro -->
                    <div class="w-full md:pr-6 md:border-r md:border-gray-300 dark:border-gray-700 ">
                        <p class="font-semibold mb-2">Cadastro:</p>
                        <div class="grid grid-cols-1">
                            <p class="mb-0">
                                <span class="font-medium">Usuário:</span>
                                {{ material.criado_por?.nome }}
                            </p>
                            <p class="mb-0">
                                <span class="font-medium">Data:</span>
                                {{ material.created_at | date: "dd/MM/yyyy 'às' HH:mm:ss" }}
                            </p>
                        </div>
                    </div>

                    <!-- Atualização -->
                    <div class="w-full md:pl-6 mt-4 md:mt-0">
                        <p class="font-semibold mb-0">Atualização:</p>

                        <div class="grid grid-cols-1">
                            <p class="mb-0">
                                <span class="font-medium">Usuário:</span>
                                {{ material.atualizado_por?.nome }}
                            </p>
                            <p class="mb-0">
                                <span class="font-medium">Data:</span>
                                {{ material.updated_at | date: "dd/MM/yyyy 'às' HH:mm:ss" }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    }
</div>
